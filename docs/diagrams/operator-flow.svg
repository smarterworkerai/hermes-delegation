<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1051.6667px" preserveAspectRatio="none" style="width:711px;height:1051px;background:#FFFFFF;" version="1.1" viewBox="0 0 711 1051" width="711.6667px" zoomAndPan="magnify"><title>Hermes Delegation &#8212; Operator Usage Flow</title><defs/><g><g class="title" data-source-line="4"><text fill="#000000" font-family="Inter" font-size="23.3333" font-weight="bold" lengthAdjust="spacing" textLength="569.0348" x="69.6008" y="54.9919">Hermes Delegation &#8212; Operator Usage Flow</text></g><ellipse cx="346.7635" cy="95.4948" fill="#5B8FD9" rx="16.6667" ry="16.6667" style="stroke:#222222;stroke-width:1.6667;"/><rect fill="#EEF4FF" height="108.9974" rx="11.6667" ry="11.6667" style="stroke:#3E5F8A;stroke-width:0.8333;" width="368.4049" x="162.561" y="145.4948"/><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="287.2738" x="179.2277" y="182.2729">Prepare host prerequisites</text><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="335.0716" x="179.2277" y="207.4943">(authorized_keys, .worker-env,</text><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="220.2425" x="179.2277" y="232.7157">/workspace mounts)</text><rect fill="#EEF4FF" height="83.776" rx="11.6667" ry="11.6667" style="stroke:#3E5F8A;stroke-width:0.8333;" width="372.1289" x="160.6991" y="287.8255"/><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="134.4857" x="177.3657" y="324.6037">Start worker</text><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="338.7956" x="177.3657" y="349.825">`docker compose up -d --build`</text><rect fill="#EEF4FF" height="83.776" rx="11.6667" ry="11.6667" style="stroke:#3E5F8A;stroke-width:0.8333;" width="386.6968" x="153.4151" y="404.9349"/><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="155.7397" x="170.0818" y="441.7131">Verify runtime</text><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="353.3634" x="170.0818" y="466.9344">(SSH + `check-worker-runtime`)</text><rect fill="#EEF4FF" height="83.776" rx="11.6667" ry="11.6667" style="stroke:#3E5F8A;stroke-width:0.8333;" width="428.877" x="132.325" y="522.0443"/><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="164.3726" x="148.9917" y="558.8224">Run delegation</text><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="395.5436" x="148.9917" y="584.0438">`start-delegation &lt;host&gt; &lt;model&gt;`</text><rect fill="#EEF4FF" height="83.776" rx="11.6667" ry="11.6667" style="stroke:#3E5F8A;stroke-width:0.8333;" width="316.9784" x="188.2743" y="639.1536"/><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="283.645" x="204.941" y="675.9318">Worker executes task and</text><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="205.2091" x="204.941" y="701.1532">writes run artifacts</text><polygon fill="#EAF7ED" points="203.5763,756.263,489.9508,756.263,509.9508,776.263,489.9508,796.263,203.5763,796.263,183.5763,776.263,203.5763,756.263" style="stroke:#3D7A4D;stroke-width:0.8333;"/><text fill="#1E3552" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="286.3745" x="203.5763" y="783.7638">Result quality acceptable?</text><text fill="#000000" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="37.4406" x="146.1357" y="771.1532">yes</text><text fill="#000000" font-family="Inter" font-size="21.6667" lengthAdjust="spacing" textLength="26.9881" x="509.9508" y="771.1532">no</text><rect fill="#EEF4FF" height="58.5547" rx